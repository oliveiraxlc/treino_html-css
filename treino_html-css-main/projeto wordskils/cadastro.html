<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projeto wordskils</title>
    <link rel="stylesheet" href="src/cadastro.css">
</head>

<body>

    <header class="cabeçalho">
        <h1 class="title">Faça seu Cadastro</h1>
        <div class="logo">
            <a href="index.html" class="cadastro">Login</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1 class="title">Cadastro</h1>
            <div class="form">
                <input id="nome"type="text" placeholder="Digite seu Nome">
                <input id="email"type="email" placeholder="Digite seu Email">
                <input id="idade"type="datetime" placeholder="Digite sua Idade">
                <input id="senha" type="password" placeholder="Digite seu Senha">
                <input id="confsenha" type="password" placeholder="Confirme sua Senha">
                <input type="button" id="button" value="cadastrar" onclick="cadastrar()">
            </div>
        </div>
    </main>

    <script src="src/cadastro.js"></script>
</body>

</html>
